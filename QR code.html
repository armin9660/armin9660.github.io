<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      :root {
        --color-1: hsl(212, 45%, 89%);
        --color-2: hsl(216, 15%, 48%);
        --color-3: hsl(218, 44%, 22%);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Outfit;
        display: flex;
        justify-content: center;
        height: 100vh;
        align-items: center;
        background-color: var(--color-1);
        font-size: 15px;
        margin: 0;
      }
      .card {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background-color: white;
        width: 17rem;
        padding: 0.8rem;
        border-radius: 0.8rem;
      }
      .img {
        border-radius: 0.8rem;
        overflow: hidden;
      }
      .texts {
        text-align: center;
        display: flex;
        flex-direction: column;
        width: 82%;
        gap: 14px;
        margin-top: 16px;
      }
      .title {
        font-size: medium;
        font-weight: 700;
      }
      .description {
        margin: 0px;
        font-weight: 400;
        color: var(--color-2);
      }
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="img">
          <img
            src="images/image-qr-code.png"
            alt="qr code"
            width="250px"
            height="250px"
          />
        </div>
        <div class="texts">
          <p class="title">
            Improve your front-end skills by building projects
          </p>

          <p class="description">
            Scan the QR code to visit Frontend Mentor and take your coding
            skills to the next level
          </p>
        </div>

        <div class="attribution">
          Challenge by
          <a href="https://www.frontendmentor.io?ref=challenge"
            >Frontend Mentor</a
          >. Coded by <a href="#">Armin Th</a>.
        </div>
      </section>
    </main>
  </body>
</html>
